name: Update version tags

# This workflow exists on rolling, circinus, and sagitta.
# Keep all three copies in sync — backport edits via Mergify
# (`@Mergifyio backport circinus sagitta`) or cherry-pick.

on:
  push:
    branches:
      - rolling
      - circinus
      - sagitta

permissions:
  contents: write

